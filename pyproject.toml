[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-field-guide"
version = "0.1.0"
description = "Link-checked, versioned map of the LLM-judge tool ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
judge-field-guide = "judgefieldguide.check_links:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["judgefieldguide*"]

[tool.ruff]
line-length = 100
target-version = "py310"
