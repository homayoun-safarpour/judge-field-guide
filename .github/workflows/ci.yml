name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  link-check:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    permissions:
      issues: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run link check
        id: linkcheck
        run: python -m judgefieldguide.check_links | tee link-report.txt
        continue-on-error: true
      - name: Stamp last_verified after green scheduled check
        if: steps.linkcheck.outcome == 'success' && github.event_name == 'schedule'
        run: |
          python -m judgefieldguide.stamp_verified
          git config user.name "Homayoun"
          git config user.email "homayoun.safarpour@gmail.com"
          git add data/registry.json
          git diff --cached --quiet || git commit -m "chore(registry): stamp last_verified after weekly link-check"
          git push || true
      - name: Open issue on dead link (scheduled runs only)
        if: steps.linkcheck.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue list --label link-rot --state open --json number --jq '. | length' | grep -qv '^0$'; then
            echo "Open link-rot issue already exists, skipping."
            exit 0
          fi
          gh issue create \
            --title "Weekly link-check found a dead registry entry" \
            --label link-rot \
            --body-file link-report.txt
      - name: Fail job if links were dead
        if: steps.linkcheck.outcome == 'failure'
        run: exit 1
